<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Israeli Surface Stations Hourly Observations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        #map { height:100vh; width:100%; }
        #floating-title {

            padding: 5px 10px !important;
            font-family: 'Assistant', sans-serif;
            pointer-events: none !important;
            white-space: nowrap !important;
            font-size: 0.93em;
            font-weight: 600;
        }
        .obs-tooltip::before { display: none !important; }
        .wind-arrow-marker { display:flex; align-items:center; justify-content:center; }
        .time-nav { display:flex; align-items:center; gap:8px; justify-content:center; }
        .nav-btn {
            background:#f0f4f8; border:1.5px solid #d1d5db; border-radius:7px;
            padding:2px 10px; font-size:1em; font-weight:700; cursor:pointer;
            color:#374151; font-family:'Assistant',sans-serif; transition:background 0.15s; line-height:1.5;
        }
        .nav-btn:hover:not(:disabled) { background:#dbeafe; border-color:#2563eb; }
        .nav-btn:disabled { opacity:0.35; cursor:default; }
        .nav-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        #time-label { font-size:0.95em; font-weight:700; color:#1e3a8a; min-width:150px; text-align:center; }
        .measure-row { display:flex; align-items:center; gap:6px; justify-content:center; }
        #measure-select {
            font-family:'Assistant',sans-serif; font-size:0.88em; padding:3px 6px;
            border-radius:7px; border:1.5px solid #d1d5db; background:#f9fafb;
            color:#111827; cursor:pointer; max-width:220px;
        }
        #lang-btn {
            background:#f0f4f8; border:1.5px solid #d1d5db; border-radius:7px;
            padding:2px 9px; font-size:0.82em; font-weight:700; cursor:pointer;
            color:#374151; font-family:'Assistant',sans-serif; transition:background 0.15s; white-space:nowrap;
        }
        #lang-btn:hover { background:#dbeafe; border-color:#2563eb; }
        .scale-row {
            display:flex; align-items:center; justify-content:center; gap:6px;
            flex-wrap:wrap; width:100%; direction:ltr;
        }
        #scale-label { font-size:0.85em; font-weight:600; color:#374151; }
        .scale-modes { display:flex; gap:3px; }
        .scale-btn {
            background:#f0f4f8; border:1.5px solid #d1d5db; border-radius:7px;
            padding:2px 8px; font-size:0.80em; font-weight:700; cursor:pointer;
            color:#374151; font-family:'Assistant',sans-serif; transition:background 0.15s;
            white-space:nowrap;
        }
        .scale-btn:hover { background:#dbeafe; border-color:#2563eb; }
        .scale-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        .scale-custom { display:none; align-items:center; gap:4px; }
        .scale-custom.visible { display:flex; }
        .scale-input {
            width:58px; padding:2px 5px; border:1.5px solid #d1d5db; border-radius:6px;
            background:#fff; color:#111827; font-family:'Assistant',sans-serif;
            font-size:0.80em; text-align:center;
        }
        .scale-input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 2px rgba(37,99,235,0.12); }

        .colorbar-control {
            background:rgba(255,255,255,0.95); padding:10px 8px; border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15); display:flex; gap:8px;
            border:1px solid #e2e8f0; direction:ltr;

        .colorbar-gradient { width:13px; border-radius:4px; }
        .code-legend { flex-direction:column; gap:3px; max-width:260px; font-size:11px; color:#1e293b; }
        .code-legend .code-row { display:flex; align-items:flex-start; gap:6px; line-height:1.25; }
        .code-legend .code-swatch {
            flex:none; width:11px; height:11px; margin-top:1px; border-radius:50%; border:1px solid #fff;
            box-shadow:0 0 0 1px #94a3b8;

            display:flex; flex-direction:column; justify-content:space-between;
            font-size:10px; font-weight:700; color:#334155; padding:2px 0; min-width:36px; text-align:right;

        .loading-overlay {

        }

            width:44px; height:44px; border:4px solid #e2e8f0; border-top:4px solid #2563eb;
            border-radius:50%; animation:spin 1s linear infinite; margin-bottom:14px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .loading-text { font-size:1.05em; color:#475569; font-weight:600; }
        @media (max-width:600px) {
            #floating-title { width:96%; max-width:none; }
            #floating-title h1 { font-size:1em !important; }
            #measure-select { max-width:170px; }
            .scale-btn { padding:2px 6px; }
            .scale-input { width:52px; }
        }
    </style>
</head>
<body>
<div id="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading observations&#8230;</div>
</div>
<div id="floating-title" style="flex-direction:column;align-items:center;gap:6px;padding:10px 16px;">
    <div style="display:flex;justify-content:space-between;width:100%;align-items:center;gap:8px;">
        <button onclick="document.getElementById('floating-title').style.display='none'"
            style="background:none;border:none;font-size:1.4em;cursor:pointer;color:#64748b;padding:0;line-height:1;">&#215;</button>
        <h1 id="page-title" style="margin:0;font-size:1.1em;display:flex;align-items:center;gap:7px;">
            <img src="logo.jpg" alt="Icon" class="title-icon" style="height:1.2em;">
            <span id="title-text">Israeli Surface Stations Hourly Observations</span>
        </h1>
        <button id="lang-btn" onclick="toggleLang()">&#1506;&#1489;</button>
    </div>
    <div class="time-nav" style="direction:ltr;">
        <button class="nav-btn" id="btn-prev" onclick="stepTime(-1)" title="Previous time step">&#9664;</button>
        <span id="time-label">&#8212;</span>
        <button class="nav-btn" id="btn-next" onclick="stepTime(+1)" title="Next time step">&#9654;</button>
        <button class="nav-btn" id="btn-latest" onclick="goLatest()" title="Jump to latest available time for this measure">&#8677;</button>
    </div>
    <div class="measure-row">
        <label id="measure-label" for="measure-select" style="font-size:0.85em;font-weight:600;color:#374151;">Measure:</label>
        <select id="measure-select" onchange="onMeasureChange()"></select>
    </div>
    <div class="scale-row">
        <span id="scale-label">Scale:</span>
        <div class="scale-modes">
            <button class="scale-btn active" id="scale-set" onclick="setScaleMode('set')">Set</button>
            <button class="scale-btn" id="scale-minmax" onclick="setScaleMode('minmax')">Min–Max</button>
            <button class="scale-btn" id="scale-custom" onclick="setScaleMode('custom')">Custom</button>
        </div>
        <div id="custom-scale-fields" class="scale-custom">
            <input id="scale-min" class="scale-input" type="number" step="any" placeholder="Min"
                   aria-label="Custom scale minimum" onchange="applyCustomScale()" onkeydown="handleScaleKey(event)">
            <span>&ndash;</span>
            <input id="scale-max" class="scale-input" type="number" step="any" placeholder="Max"
                   aria-label="Custom scale maximum" onchange="applyCustomScale()" onkeydown="handleScaleKey(event)">
            <span id="scale-unit"></span>
        </div>
    </div>
    <div style="display:flex;flex-direction:row;justify-content:center;gap:18px;align-items:center;width:100%;">
        <a href="index.html" class="home-btn" style="margin:0;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span id="home-label">Home</span>
        </a>
        <div class="data-source" style="margin-top:0;">
            <span id="source-label">Data from</span>
            <a href="https://ims.gov.il/sites/default/files/ims_data/xml_files/observ.xml" target="_blank" rel="noopener">
                <img src="https://ims.gov.il/themes/imst/ims/images/logo.jpg" alt="IMS" class="ims-logo" style="height:14px;">
            </a>
        </div>
    </div>
</div>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([31.5, 35.0], 8);
L.tileLayer('https://cdnil.govmap.gov.il/xyz/heb/{z}/{x}/{y}.png', {
    attribution: '© המרכז למיפוי ישראל www.govmap.gov.il'
}).addTo(map);
let lang = 'en';
let params = [];
let timeKeys = [];
let timeIndex = 0;
let currentMeasure = 'TD';
let data = {};
let activeMarkers = [];
let colorbarCtrl = null;
let availableShorts = new Set();
let autoLatest = true;
let xmlTitle = 'Israeli Surface Stations Hourly Observations';
let colorScaleMode = 'set';
let customScaleRanges = {};
// Shareable view: ?measure=R24&scale=minmax&lang=he. scale is set | minmax | custom;

const SCALE_MODES = ['set','minmax','custom'];
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('measure')) currentMeasure = urlParams.get('measure').toUpperCase();
if (SCALE_MODES.includes(urlParams.get('scale'))) colorScaleMode = urlParams.get('scale');
const WIND_MEASURES = ['FF','FFX','FM','FM1','FX1'];
const RAIN_MEASURES = ['R01','R06','R12','R24'];
const heParamNames = {
    TT:'טמפרטורת אוויר', TD:'טמפרטורת נקודת הטל', TWE:'טמפרטורה רטובה',
    RH:'לחות יחסית', DD:'כיוון הרוח', FF:'מהירות הרוח',
    PO:'לחץ אטמוספרי (תחנה)', PP:'לחץ ברמת הים', VV:'נראות אופקית',
    TW:'טמפרטורת ים', TN:'טמפרטורה מינימלית', TX:'טמפרטורה מקסימלית',
    GRD:'קרינה גלובלית יומית', GRH:'קרינה גלובלית שעתית',

    PP1:'שינוי לחץ 1 שעה', PP3:'שינוי לחץ 3 שעות',
    R24:'גשם יומי', R01:'גשם שעתי', R06:'גשם 6 שעות', R12:'גשם 12 שעות',
    RRS:'גשם עונתי', EEE:'התאדות יומית',
    TN1:'טמפרטורה מינימלית שעתית', TX1:'טמפרטורה מקסימלית שעתית',
    FX1:'מהירות רוח מקסימלית שעתית', FM1:'מהירות משב שעתית',

    CL:'עננים נמוכים', CM:'עננים בינוניים', CH:'עננים גבוהים',

};
// Dropdown topics, in display order. Within a group the order is by meaning

// feed has but no group lists goes to the last group; empty groups are hidden.
const MEASURE_GROUPS = [
    { en:'Rain', he:'גשם', shorts:['R01','R06','R12','R24','RRS','EEE'] },
    { en:'Temperature & humidity', he:'טמפרטורה ולחות',
      shorts:['TT','TX1','TN1','TX','TN','TD','TWE','RH','TG','TW'] },
    { en:'Wind', he:'רוח', shorts:['FF','FFX','FX1','FM1','FM'] },
    { en:'Clouds & visibility', he:'עננות ונראות', shorts:['N','NH','H','CL','CM','CH','VV'] },
    { en:'Pressure', he:'לחץ', shorts:['PP','PO','PP1','PP3','H85'] },
    { en:'Misc', he:'שונות', shorts:['GRH','GRD','SSS','WW','W1','W2'] }
];
// Cloud measures are WMO SYNOP code numbers, not amounts, so they are shown by
// meaning: a label per code and a fixed color per code instead of a scale.
// The feed writes the SYNOP "/" (not observable) as 10.
const OKTAS = {
    0:['Clear sky (0/8)','שמיים בהירים (0/8)'], 1:['1/8 or less','1/8 או פחות'],
    2:['2/8','2/8'], 3:['3/8','3/8'], 4:['4/8','4/8'], 5:['5/8','5/8'], 6:['6/8','6/8'],
    7:['7/8 or more, not overcast','7/8 ומעלה, לא מעונן לגמרי'],
    8:['Overcast (8/8)','מעונן לגמרי (8/8)'],
    9:['Sky obscured (fog etc.)','השמיים מוסתרים (ערפל וכו׳)'],
    10:['Not determinable','לא ניתן לקביעה']
};
const CLOUD_CODES = {
    N: OKTAS,
    NH: OKTAS,
    H: {
        0:['0–50 m','0–50 מ׳'], 1:['50–100 m','50–100 מ׳'], 2:['100–200 m','100–200 מ׳'],
        3:['200–300 m','200–300 מ׳'], 4:['300–600 m','300–600 מ׳'], 5:['600–1,000 m','600–1,000 מ׳'],
        6:['1,000–1,500 m','1,000–1,500 מ׳'], 7:['1,500–2,000 m','1,500–2,000 מ׳'],
        8:['2,000–2,500 m','2,000–2,500 מ׳'], 9:['2,500 m or more, or no clouds','2,500 מ׳ ומעלה, או ללא עננים'],
        10:['Not determinable','לא ניתן לקביעה']
    },
    CL: {
        0:['No low clouds','אין עננים נמוכים'],
        1:['Fair-weather cumulus','קומולוס של מזג אוויר נאה'],
        2:['Cumulus of moderate or strong vertical extent','קומולוס בעל התפתחות אנכית בינונית עד חזקה'],
        3:['Cumulonimbus without anvil','קומולונימבוס ללא סדן'],
        4:['Stratocumulus from spreading cumulus','סטרטוקומולוס מהתפשטות קומולוס'],
        5:['Stratocumulus','סטרטוקומולוס'],
        6:['Stratus','סטרטוס'],
        7:['Ragged stratus or cumulus of bad weather','סטרטוס או קומולוס קרועים של מזג אוויר סגרירי'],
        8:['Cumulus and stratocumulus at different levels','קומולוס וסטרטוקומולוס בגבהים שונים'],
        9:['Cumulonimbus with anvil','קומולונימבוס עם סדן'],
        10:['Not visible (darkness, fog...)','לא נראים (חושך, ערפל וכו׳)']
    },
    CM: {
        0:['No middle clouds','אין עננים בינוניים'],
        1:['Thin altostratus','אלטוסטרטוס דק'],
        2:['Thick altostratus or nimbostratus','אלטוסטרטוס עבה או נימבוסטרטוס'],
        3:['Thin altocumulus, one level','אלטוקומולוס דק בשכבה אחת'],
        4:['Patches of altocumulus, changing (often lenticular)','כתמי אלטוקומולוס משתנים (לרוב עדשתיים)'],
        5:['Altocumulus in bands, thickening','אלטוקומולוס ברצועות, מתעבה'],
        6:['Altocumulus from spreading cumulus','אלטוקומולוס מהתפשטות קומולוס'],
        7:['Altocumulus in two layers, or with altostratus or nimbostratus','אלטוקומולוס בשתי שכבות, או עם אלטוסטרטוס או נימבוסטרטוס'],
        8:['Altocumulus with turrets or tufts (castellanus, floccus)','אלטוקומולוס מגדלי או פתיתי'],
        9:['Altocumulus of a chaotic sky','אלטוקומולוס בשמיים כאוטיים'],
        10:['Not visible (hidden by lower clouds)','לא נראים (מוסתרים בעננים נמוכים)']
    },
    CH: {
        0:['No high clouds','אין עננים גבוהים'],
        1:['Cirrus filaments (mares’ tails)','צירוס סיבי (זנבות סוס)'],
        2:['Dense cirrus in patches or tufts','צירוס סמיך בכתמים או בציציות'],
        3:['Dense cirrus left from a cumulonimbus anvil','צירוס סמיך משארית סדן של קומולונימבוס'],
        4:['Cirrus hooks or filaments, spreading','צירוס מאונקל או סיבי, מתפשט'],
        5:['Cirrus or cirrostratus in bands, below 45°','צירוס או צירוסטרטוס ברצועות, מתחת ל־45°'],
        6:['Cirrus or cirrostratus in bands, above 45°','צירוס או צירוסטרטוס ברצועות, מעל 45°'],
        7:['Cirrostratus covering the whole sky','צירוסטרטוס המכסה את כל השמיים'],
        8:['Cirrostratus not covering the whole sky','צירוסטרטוס שאינו מכסה את כל השמיים'],
        9:['Cirrocumulus','צירוקומולוס'],
        10:['Not visible (hidden by lower clouds)','לא נראים (מוסתרים בעננים נמוכים)']
    }
};
const CLOUD_TYPE_COLORS = ['#9ecbff','#2ca02c','#ff7f0e','#d62728','#9467bd','#8c564b',
                           '#7f7f7f','#17becf','#bcbd22','#e377c2'];
const NOT_OBSERVED_COLOR = '#d1d5db';
function mixColor(a, b, t) {
    return 'rgb(' + a.map(function(v, i) { return Math.round(v + (b[i] - v) * t); }).join(',') + ')';
}
function cloudColor(pshort, code) {
    if (code === 10 || !(code in CLOUD_CODES[pshort])) return NOT_OBSERVED_COLOR;
    if (pshort === 'N' || pshort === 'NH') {
        if (code === 9) return '#a78bfa';                                // obscured
        return mixColor([120,185,255], [75,75,75], code / 8);           // sky blue -> overcast gray
    }
    if (pshort === 'H') return mixColor([60,60,60], [205,228,255], code / 9);  // low and dark -> high and light
    return CLOUD_TYPE_COLORS[code];
}
function cloudLabel(pshort, code) {
    const entry = CLOUD_CODES[pshort][code];
    if (!entry) return String(code);
    return code + ' – ' + entry[lang === 'he' ? 1 : 0];
}
const heUI = {
    measure:'פרמטר:', home:'דף הבית', sourceLabel:'נתונים מ',
    title:'תצפיות שעתיות של תחנות פני קרקע בישראל',
    scale:'טווח:', setScale:'קבוע', minmax:'מינ׳–מקס׳', custom:'מותאם'
};
function jetColor(ratio) {
    const r0 = Math.max(0, Math.min(1, ratio));
    let r, g, b;
    if      (r0 < 0.25) { r=0; g=Math.round(r0*4*255); b=255; }
    else if (r0 < 0.50) { r=0; g=255; b=Math.round((0.5-r0)*4*255); }
    else if (r0 < 0.75) { r=Math.round((r0-0.5)*4*255); g=255; b=0; }
    else                 { r=255; g=Math.round((1-r0)*4*255); b=0; }
    return 'rgb('+r+','+g+','+b+')';
}
const fixedRanges = {
    TT:[-50,450], TD:[-100,350], TWE:[-50,350], TN:[-50,350], TX:[-50,450],
    TN1:[-50,350], TX1:[-50,450],
    TG:[-100,300], TW:[100,350], RH:[0,100],
    FF:[0,200], FFX:[0,200], FM:[0,200], FM1:[0,200], FX1:[0,200],
    PO:[8500,11000], PP:[8500,11000],
    R01:[0,200], R06:[0,500], R12:[0,1000], R24:[0,2000],
    GRD:[0,60000], GRH:[0,4000]
};
function getValsAtTime(pshort, tIdx) {
    const tk = timeKeys[tIdx];
    if (!data[tk]) return [];
    return Object.values(data[tk]).map(function(s){ return s.values[pshort]; }).filter(function(v){ return v !== undefined && !isNaN(v); });
}
function getTimeVals(pshort) {
    return getValsAtTime(pshort, timeIndex);
}
function getMinMaxRangeRaw(pshort) {
    const vals = getTimeVals(pshort);
    if (!vals.length) return null;
    return [Math.min.apply(null, vals), Math.max.apply(null, vals)];
}
function getSetRangeRaw(pshort) {
    if (pshort === 'RH') return [0, 100];
    if (pshort === 'VV') return [0, 50000];
    if (RAIN_MEASURES.includes(pshort)) {
        return [0, {R01:200,R06:500,R12:1000,R24:2000}[pshort]];
    }
    if (WIND_MEASURES.includes(pshort)) {
        // Preserve the existing 0–70 km/h wind color scale.
        return [0, (70 / 3.6) * 10];
    }
    if (fixedRanges[pshort]) return fixedRanges[pshort].slice();
    // Parameters without a predefined range already used current-time min/max.
    return getMinMaxRangeRaw(pshort);
}
function getActiveRangeRaw(pshort) {
    if (colorScaleMode === 'minmax') return getMinMaxRangeRaw(pshort);
    if (colorScaleMode === 'custom' && customScaleRanges[pshort]) return customScaleRanges[pshort];
    return getSetRangeRaw(pshort);
}
function rawToDisplay(pshort, rawVal, pinfo) {
    if (WIND_MEASURES.includes(pshort)) return (rawVal / 10) * 3.6;
    if (pshort === 'VV') return rawVal / 1000;
    return rawVal / pinfo.scale;
}
function displayToRaw(pshort, displayVal, pinfo) {
    if (WIND_MEASURES.includes(pshort)) return (displayVal / 3.6) * 10;
    if (pshort === 'VV') return displayVal * 1000;
    return displayVal * pinfo.scale;
}
function getScaleUnit(pshort, pinfo) {
    if (WIND_MEASURES.includes(pshort)) return 'km/h';
    if (pshort === 'VV') return 'km';
    if (RAIN_MEASURES.includes(pshort)) return 'mm';
    if (['GRD','GRH'].includes(pshort)) return 'W/m²';
    if (pinfo.units === '%') return '%';
    if (pinfo.units.indexOf('C') >= 0) return '°C';
    if (pinfo.units.indexOf('hPa') >= 0) return 'hPa';
    if (pinfo.units === 'm') return 'm';
    if (pinfo.units === 'Minutes') return 'min';
    return pinfo.units.replace(/^Tenths\s+/, '');
}
function valueColor(pshort, rawVal, pinfo) {
    if (CLOUD_CODES[pshort]) return cloudColor(pshort, rawVal);
    const range = getActiveRangeRaw(pshort);
    if (!range) return jetColor(0.5);
    const mn = range[0], mx = range[1];
    let ratio = (mn === mx) ? 0.5 : (rawVal - mn) / (mx - mn);
    ratio = Math.max(0, Math.min(1, ratio));
    if (pshort === 'RH') return jetColor(1 - ratio);
    if (RAIN_MEASURES.includes(pshort)) {
        return 'rgb('+Math.round(180*(1-ratio))+','+Math.round(220*(1-ratio))+',255)';
    }
    return jetColor(ratio);
}
function fmtVal(pshort, rawVal, pinfo) {
    if (CLOUD_CODES[pshort]) return cloudLabel(pshort, rawVal);
    const v = rawVal / pinfo.scale;
    if (WIND_MEASURES.includes(pshort)) return (v * 3.6).toFixed(1) + ' km/h';
    if (pshort === 'VV')                    return (rawVal / 1000).toFixed(1) + ' km';
    if (['GRD','GRH'].includes(pshort))     return v.toFixed(0) + ' W/m\u00b2';
    if (pinfo.units === '%')                return v.toFixed(0) + '%';
    if (pinfo.units.indexOf('C') >= 0)      return v.toFixed(1) + '\u00b0C';
    if (pinfo.units.indexOf('hPa') >= 0)    return v.toFixed(1) + ' hPa';
    if (pinfo.units.indexOf('mm') >= 0)     return v.toFixed(1) + ' mm';
    if (pinfo.units === 'm')                return v.toFixed(0) + ' m';
    if (pinfo.units === 'Minutes')          return v.toFixed(0) + ' min';
    return v.toFixed(1) + (pinfo.units ? ' ' + pinfo.units : '');
}
function ensureCustomScale() {
    if (customScaleRanges[currentMeasure]) return;
    const range = getSetRangeRaw(currentMeasure) || getMinMaxRangeRaw(currentMeasure);
    if (range) customScaleRanges[currentMeasure] = range.slice();
}
function setScaleMode(mode) {
    colorScaleMode = mode;
    if (mode === 'custom') ensureCustomScale();
    updateScaleControls();
    renderMarkers();
    syncUrl();
}
// Write the current measure and scale into the address bar, keeping any other parameters
function syncUrl() {
    const q = new URLSearchParams(location.search);
    q.set('measure', currentMeasure);
    q.set('scale', colorScaleMode);
    q.set('lang', lang);
    const pinfo = params.find(function(p) { return p.short === currentMeasure; });
    const range = colorScaleMode === 'custom' ? customScaleRanges[currentMeasure] : null;
    if (range && pinfo) {
        q.set('min', formatInputValue(rawToDisplay(currentMeasure, range[0], pinfo)));
        q.set('max', formatInputValue(rawToDisplay(currentMeasure, range[1], pinfo)));
    } else {
        q.delete('min');
        q.delete('max');
    }
    history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
}
// A custom range from the URL, applied once the measure's units are known
function applyUrlCustomRange() {
    if (colorScaleMode !== 'custom') return;
    if ((urlParams.get('measure') || '').toUpperCase() !== currentMeasure) return;
    const mn = parseFloat(urlParams.get('min'));
    const mx = parseFloat(urlParams.get('max'));
    const pinfo = params.find(function(p) { return p.short === currentMeasure; });
    if (!pinfo || !Number.isFinite(mn) || !Number.isFinite(mx) || mn >= mx) return;
    customScaleRanges[currentMeasure] = [
        displayToRaw(currentMeasure, mn, pinfo),
        displayToRaw(currentMeasure, mx, pinfo)
    ];
}
function formatInputValue(value) {
    if (!Number.isFinite(value)) return '';
    return String(parseFloat(value.toFixed(3)));
}
function updateScaleControls() {
    // Codes have a fixed color each, so there is no scale to choose
    const scaleRow = document.querySelector('.scale-row');
    if (scaleRow) scaleRow.style.display = CLOUD_CODES[currentMeasure] ? 'none' : '';
    ['set','minmax','custom'].forEach(function(mode) {
        const btn = document.getElementById('scale-' + mode);
        if (btn) btn.classList.toggle('active', colorScaleMode === mode);
    });
    const fields = document.getElementById('custom-scale-fields');
    if (!fields) return;
    fields.classList.toggle('visible', colorScaleMode === 'custom');
    if (colorScaleMode !== 'custom') return;
    ensureCustomScale();
    const pinfo = params.find(function(p) { return p.short === currentMeasure; });
    const range = customScaleRanges[currentMeasure];
    if (!pinfo || !range) return;
    const minInput = document.getElementById('scale-min');
    const maxInput = document.getElementById('scale-max');
    minInput.value = formatInputValue(rawToDisplay(currentMeasure, range[0], pinfo));
    maxInput.value = formatInputValue(rawToDisplay(currentMeasure, range[1], pinfo));
    minInput.classList.remove('invalid');
    maxInput.classList.remove('invalid');
    document.getElementById('scale-unit').textContent = getScaleUnit(currentMeasure, pinfo);
}
function applyCustomScale() {
    const minInput = document.getElementById('scale-min');
    const maxInput = document.getElementById('scale-max');
    const mn = parseFloat(minInput.value);
    const mx = parseFloat(maxInput.value);
    const valid = Number.isFinite(mn) && Number.isFinite(mx) && mn < mx;
    minInput.classList.toggle('invalid', !valid);
    maxInput.classList.toggle('invalid', !valid);
    if (!valid) return;
    const pinfo = params.find(function(p) { return p.short === currentMeasure; });
    if (!pinfo) return;
    customScaleRanges[currentMeasure] = [
        displayToRaw(currentMeasure, mn, pinfo),
        displayToRaw(currentMeasure, mx, pinfo)
    ];
    renderMarkers();
    syncUrl();
}
function handleScaleKey(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        applyCustomScale();
        event.target.blur();
    }
}
function parseXML(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const titleEl = doc.querySelector('Title');
    if (titleEl) {
        xmlTitle = titleEl.textContent.trim();
        document.getElementById('title-text').textContent = xmlTitle;
        document.title = xmlTitle;
    }
    params = [];
    doc.querySelectorAll('ParametersDescription > Parameter').forEach(function(el) {
        const short = el.querySelector('ParameterShortName').textContent.trim();
        const full  = el.querySelector('ParameterFullName').textContent.trim();
        const units = el.querySelector('ParameterUnits').textContent.trim();
        const scale = units.indexOf('Tenths') === 0 ? 10 : 1;
        params.push({ short:short, full:full, units:units, scale:scale });
    });
    data = {};
    doc.querySelectorAll('Observations > Observation').forEach(function(obs) {
        const dt   = obs.querySelector('DateTime').textContent.trim();
        const stn  = obs.querySelector('Station');
        const num  = stn.querySelector('StationNumber').textContent.trim();
        const lat  = parseFloat(stn.querySelector('StationLatitude').textContent);
        const lon  = parseFloat(stn.querySelector('StationLongitude').textContent);
        const name = stn.querySelector('StationName').textContent.trim();
        if (!data[dt]) data[dt] = {};
        if (!data[dt][num]) data[dt][num] = { lat:lat, lon:lon, name:name, values:{} };
        obs.querySelectorAll('Observation > Parameter, Observations > Observation > Parameter').forEach(function(p) {
            const s = p.querySelector('ParameterShortName').textContent.trim();
            const v = parseFloat(p.querySelector('ParameterValue').textContent);
            data[dt][num].values[s] = v;
        });
    });
    timeKeys = Object.keys(data).sort();
    timeIndex = timeKeys.length - 1;
    // collect which param shorts have at least one real value
    availableShorts = new Set();
    Object.values(data).forEach(function(stns) {
        Object.values(stns).forEach(function(stn) {
            Object.keys(stn.values).forEach(function(k) { availableShorts.add(k); });
        });
    });
}
function buildDropdown() {
    const sel = document.getElementById('measure-select');
    const prev = sel.value || currentMeasure;
    sel.innerHTML = '';
    // Measures with data, by short name. DD is drawn as the direction of the wind
    // arrows, so it has no entry of its own.
    const shown = {};
    params.forEach(function(p) {
        if (p.short === 'DD') return;
        if (availableShorts.size > 0 && !availableShorts.has(p.short)) return; // no data
        shown[p.short] = p;
    });
    const grouped = new Set();
    MEASURE_GROUPS.forEach(function(g) { g.shorts.forEach(function(s) { grouped.add(s); }); });
    const leftovers = params.map(function(p) { return p.short; })
        .filter(function(s) { return shown[s] && !grouped.has(s); });
    MEASURE_GROUPS.forEach(function(g, gi) {
        let shorts = g.shorts.filter(function(s) { return shown[s]; });
        if (gi === MEASURE_GROUPS.length - 1) shorts = shorts.concat(leftovers);
        if (!shorts.length) return;
        const group = document.createElement('optgroup');
        group.label = lang === 'he' ? g.he : g.en;
        shorts.forEach(function(s) {
            const p = shown[s];
            const opt = document.createElement('option');
            opt.value = p.short;
            opt.textContent = p.short + ' – ' + (lang === 'he' ? (heParamNames[p.short] || p.full) : p.full);
            if (WIND_MEASURES.includes(p.short)) opt.textContent += (lang === 'he' ? ' (חצים)' : ' (arrows)');
            group.appendChild(opt);
        });
        sel.appendChild(group);
    });
    sel.value = (sel.querySelector('option[value="'+prev+'"]') ? prev : (sel.options[0]||{}).value) || prev;
    currentMeasure = sel.value;
}
function clearMarkers() {
    activeMarkers.forEach(function(m) { map.removeLayer(m); });
    activeMarkers = [];
}
function renderMarkers() {
    clearMarkers();
    if (colorbarCtrl) { map.removeControl(colorbarCtrl); colorbarCtrl = null; }
    const tk = timeKeys[timeIndex];
    if (!tk) return;
    const pinfo = params.find(function(p) { return p.short === currentMeasure; });
    if (!pinfo) return;
    document.getElementById('time-label').textContent = utcToIsrael(tk);
    document.getElementById('btn-prev').disabled = (timeIndex === 0);
    document.getElementById('btn-next').disabled = (timeIndex === timeKeys.length - 1);
    document.getElementById('btn-latest').classList.toggle('active', autoLatest);
    const stations = data[tk];
    if (!stations) return;
    const isWind = WIND_MEASURES.includes(currentMeasure);
    Object.values(stations).forEach(function(stn) {
        const rawVal = stn.values[currentMeasure];
        if (rawVal === undefined || isNaN(rawVal)) return;
        if (isNaN(stn.lat) || isNaN(stn.lon)) return;
        const color = valueColor(currentMeasure, rawVal, pinfo);
        const dispVal = fmtVal(currentMeasure, rawVal, pinfo);
        const dd = stn.values['DD'];
        if (isWind && !isNaN(dd)) {
            // Wind arrow marker
            const wsKmh = (rawVal / 10) * 3.6;
            const size = Math.max(14, Math.min(36, 10 + wsKmh * 0.5));
            const rot = (dd + 180) % 360;
            const icon = L.divIcon({
                className: 'wind-arrow-marker',
                html: '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="transform:rotate('+rot+'deg);display:block;" xmlns="http://www.w3.org/2000/svg"><polygon points="12,2 18,20 12,16 6,20" fill="'+color+'" stroke="white" stroke-width="1.5"/></svg>',
                iconSize: [size, size], iconAnchor: [size/2, size/2]
            });
            const m = L.marker([stn.lat, stn.lon], { icon:icon }).addTo(map);
            m.bindTooltip('<b>'+stn.name+'</b><br>'+dispVal+' | dir '+dd+'\u00b0', {
                permanent:false, direction:'right', className:'obs-tooltip', sticky:false
            });
            activeMarkers.push(m);
        } else {
            const m = L.circleMarker([stn.lat, stn.lon], {
                radius:8, fillColor:color, color:'#fff', weight:1.5, opacity:1, fillOpacity:0.92
            }).addTo(map);
            m.bindTooltip('<b>'+stn.name+'</b><br>'+dispVal, {
                permanent:false, direction:'right', className:'obs-tooltip', sticky:false
            });
            activeMarkers.push(m);
        }
    });
    renderColorbar(pinfo);
}
function formatScaleNumber(value, span) {
    const absSpan = Math.abs(span);
    let decimals = 0;
    if (absSpan < 1) decimals = 2;
    else if (absSpan < 10) decimals = 1;
    const rounded = parseFloat(value.toFixed(decimals));
    return Object.is(rounded, -0) ? '0' : String(rounded);
}
function makeScaleLabels(minVal, maxVal) {
    if (!Number.isFinite(minVal) || !Number.isFinite(maxVal)) return [];
    const span = maxVal - minVal;
    if (span === 0) {
        const same = formatScaleNumber(minVal, 0);
        return [same, same];
    }
    const labels = [];
    const intervals = 6;
    for (let i = intervals; i >= 0; i--) {
        labels.push(formatScaleNumber(minVal + span * i / intervals, span));
    }
    return labels;
}
// Legend for a code measure: the codes reported at this time, each with its color and meaning
function renderCodeLegend(pinfo) {
    const sh = currentMeasure;
    const codes = Array.from(new Set(getTimeVals(sh))).sort(function(a, b) { return a - b; });
    colorbarCtrl = L.control({ position:'bottomleft' });
    colorbarCtrl.onAdd = function() {
        const div = L.DomUtil.create('div', 'colorbar-control code-legend');
        div.dir = lang === 'he' ? 'rtl' : 'ltr';
        const title = lang === 'he' ? (heParamNames[sh] || pinfo.full) : pinfo.full;
        div.innerHTML = '<div class="code-title">' + title + '</div>' + codes.map(function(c) {
            return '<div class="code-row"><span class="code-swatch" style="background:' +
                cloudColor(sh, c) + '"></span><span>' + cloudLabel(sh, c) + '</span></div>';
        }).join('');
        return div;
    };
    colorbarCtrl.addTo(map);
}
function renderColorbar(pinfo) {
    if (CLOUD_CODES[currentMeasure]) return renderCodeLegend(pinfo);
    colorbarCtrl = L.control({ position:'bottomleft' });
    colorbarCtrl.onAdd = function() {
        const div = L.DomUtil.create('div', 'colorbar-control');
        const sh = currentMeasure;
        const tickPx = 22;
        let gradient = 'linear-gradient(to top,rgb(0,0,255),rgb(0,255,255),rgb(0,255,0),rgb(255,255,0),rgb(255,0,0))';
        if (sh === 'RH') {
            gradient = 'linear-gradient(to top,rgb(255,0,0),rgb(255,255,0),rgb(0,255,0),rgb(0,255,255),rgb(0,0,255))';
        } else if (RAIN_MEASURES.includes(sh)) {
            gradient = 'linear-gradient(to top,rgb(180,220,255),rgb(0,100,255))';
        }
        const range = getActiveRangeRaw(sh);
        if (!range) { div.innerHTML=''; return div; }
        const mn = rawToDisplay(sh, range[0], pinfo);
        const mx = rawToDisplay(sh, range[1], pinfo);
        const labels = makeScaleLabels(mn, mx);
        const unitHdr = getScaleUnit(sh, pinfo);
        const barH = Math.max(44, (labels.length - 1) * tickPx);
        const labelsHtml = labels.map(function(l){return '<span>'+l+'</span>';}).join('');
        div.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">' +
            (unitHdr ? '<div style="font-size:9px;font-weight:700;color:#334155;text-align:right;padding-bottom:2px;">'+unitHdr+'</div>' : '') +
            '<div style="display:flex;gap:8px;">' +
            '<div class="colorbar-labels" style="height:'+barH+'px;">'+labelsHtml+'</div>' +
            '<div class="colorbar-gradient" style="background:'+gradient+';height:'+barH+'px;"></div>' +
            '</div></div>';
        return div;
    };
    colorbarCtrl.addTo(map);
}
function utcToIsrael(dtStr) {
    // dtStr: "2026-07-30 05:00" — treat as UTC, add 3h for IDT
    var parts = dtStr.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    if (!parts) return dtStr;
    var d = new Date(Date.UTC(+parts[1],+parts[2]-1,+parts[3],+parts[4],+parts[5]));
    d = new Date(d.getTime() + 3*60*60*1000);
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())
        +' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+' IDT';
}
function setLatestMode(on) {
    autoLatest = on;
    var btn = document.getElementById('btn-latest');
    if (btn) btn.classList.toggle('active', on);
}
function latestIndexFor(pshort) {
    for (var i = timeKeys.length - 1; i >= 0; i--) {
        if (getValsAtTime(pshort, i).length > 0) return i;
    }
    return timeKeys.length - 1;
}
function goLatest() {
    setLatestMode(true);
    timeIndex = latestIndexFor(currentMeasure);
    renderMarkers();
}
function stepTime(dir) {
    setLatestMode(false);
    const ni = timeIndex + dir;
    if (ni < 0 || ni >= timeKeys.length) return;
    timeIndex = ni;
    renderMarkers();
}
function onMeasureChange() {
    currentMeasure = document.getElementById('measure-select').value;
    if (autoLatest) {
        timeIndex = latestIndexFor(currentMeasure);
    } else if (getTimeVals(currentMeasure).length === 0) {
        // current step has no data; jump to latest for this measure but keep manual mode
        timeIndex = latestIndexFor(currentMeasure);
    }
    if (colorScaleMode === 'custom') ensureCustomScale();
    updateScaleControls();
    renderMarkers();
    syncUrl();
}
function toggleLang() {
    lang = lang === 'en' ? 'he' : 'en';
    document.getElementById('lang-btn').textContent = lang === 'en' ? '\u05e2\u05d1' : 'EN';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
    if (lang === 'he') {
        document.getElementById('title-text').textContent = heUI.title;
        document.getElementById('measure-label').textContent = heUI.measure;
        document.getElementById('home-label').textContent = heUI.home;
        document.getElementById('source-label').textContent = heUI.sourceLabel;
        document.getElementById('scale-label').textContent = heUI.scale;
        document.getElementById('scale-set').textContent = heUI.setScale;
        document.getElementById('scale-minmax').textContent = heUI.minmax;
        document.getElementById('scale-custom').textContent = heUI.custom;
        document.getElementById('scale-min').placeholder = 'מינ׳';
        document.getElementById('scale-max').placeholder = 'מקס׳';
    } else {
        document.getElementById('title-text').textContent = xmlTitle;
        document.getElementById('measure-label').textContent = 'Measure:';
        document.getElementById('home-label').textContent = 'Home';
        document.getElementById('source-label').textContent = 'Data from';
        document.getElementById('scale-label').textContent = 'Scale:';
        document.getElementById('scale-set').textContent = 'Set';
        document.getElementById('scale-minmax').textContent = 'Min–Max';
        document.getElementById('scale-custom').textContent = 'Custom';
        document.getElementById('scale-min').placeholder = 'Min';
        document.getElementById('scale-max').placeholder = 'Max';
    }
    buildDropdown();
    updateScaleControls();
    syncUrl();
}
window.addEventListener('resize', function(){ map.invalidateSize(); });
window.addEventListener('load', function(){ setTimeout(function(){ map.invalidateSize(); }, 0); });

fetch('https://ims-observ.yuvharpaz.workers.dev/')
    .then(function(r){ return r.text(); })
    .then(function(xmlText){
        parseXML(xmlText);
        buildDropdown();
        applyUrlCustomRange();
        // After parseXML, which writes the English title from the feed
        if (urlParams.get('lang') === 'he') toggleLang();
        // start in latest mode — jump to latest time for default measure
        timeIndex = latestIndexFor(currentMeasure);
        setLatestMode(true);
        updateScaleControls();
        renderMarkers();
        document.getElementById('loading').style.display = 'none';
        // Leaflet can be initialized before all surrounding layout settles; force a size refresh.
        setTimeout(function(){ map.invalidateSize(); }, 0);
    })
    .catch(function(err){
        document.getElementById('loading').innerHTML =
            '<div style="background:#fef2f2;color:#991b1b;padding:24px 32px;border-radius:12px;font-size:1.05em;text-align:center;">Error loading data<br><small>'+err.message+'</small></div>';
    });
