<script>
const rawBase     = 'https://raw.githubusercontent.com/yuval-harpaz/weather/refs/heads/main/data';
const stationsUrl = `${rawBase}/ims_stations.csv`;

// Years will be detected dynamically by probing for required files.
const AVAILABLE_HEAT_YEARS = [];  // filled at startup by detectAvailableYears()

async function detectAvailableYears() {
    const currentYear = new Date().getFullYear();
    const candidates = [];
    for (let y = 2020; y <= currentYear; y++) candidates.push(y);
    const results = await Promise.all(candidates.map(async y => {
        try {
            const checks = await Promise.all([
                fetch(`${rawBase}/rh_${y}.csv`,   {method:'HEAD'}),
                fetch(`${rawBase}/ws_${y}.csv`,   {method:'HEAD'}),
                fetch(`${rawBase}/grad_${y}.csv`, {method:'HEAD'})
            ]);
            return checks.every(r => r.ok) ? y : null;
        } catch(e) { return null; }
    }));
    results.filter(y => y !== null).forEach(y => AVAILABLE_HEAT_YEARS.push(y));
}

// Stations that borrow grad (solar radiation) data from a linked station.
// Key = station name in rh/temp/ws files, Value = station name in grad file.
const GRAD_LINKS = {
    'BET DAGAN': 'BET DAGAN RAD'
};

const COLORS = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
    '#aec7e8','#ffbb78','#98df8a','#ff9896','#c5b0d5'
];

// Explicit color per measure (used in single-station "all measures" view),
// kept stable regardless of legend/trace order.
const MEASURE_COLORS = {
    DewPoint:    '#0d1b8c', // dark blue
    RH:          '#00bcd4', // cyan
    WBGT:        '#2ca02c', // green (unchanged)
    Temperature: '#ff7f0e', // orange (unchanged)
    HeatIndex:   '#d62728'  // red
};

let map;
let stationMarkers   = {};
let selectedStations = [];
let stationCoords    = {};
let computedMonthly  = {};   // name -> { RH, DewPoint, HeatIndex } 12 monthly averages
let monthlySums      = {};   // name -> per-month raw accumulators (used for pace-aware WBGT)
let rawRows          = [];   // loaded rows for current data year
let completeStations = new Set(); // stations with valid Grad, TD, WS and RH data

let currentMeasure  = 'HeatIndex';
const NOW           = new Date();
let currentDataYear = NOW.getFullYear();
let dailyMode = 'mean';   // 'mean' | 'max'
let paceUnit  = 'minperkm'; // 'minperkm' | 'kmh'

// Hourly view state
let hourlyMode  = 'last30';
let hourlyYear  = currentDataYear;
let hourlyMonth = NOW.getMonth() + 1;

// Daily extrema markers (hourly chart, single-station mode only)
let extremaOn    = false;
let extremaHour  = null; // 0-23 fixed hour, or null for auto max/min-in-daytime mode

const measureLabels = {
    RH:          'לחות יחסית (%)',
    DewPoint:    'נקודת הטל (°C)',
    HeatIndex:   'מדד חום (°C)',
    WBGT:        'WBGT (°C)',
    Temperature: 'טמפרטורה (°C)'
};

const measureInfo = {
    RH: {
        wiki: 'https://en.wikipedia.org/wiki/Relative_humidity',
        desc: 'Relative Humidity – direct measurement (%)'
    },
    DewPoint: {
        wiki: 'https://en.wikipedia.org/wiki/Dew_point',
        desc: 'Dew Point – Magnus approx: α=a·T/(b+T)+ln(RH/100), Td=b·α/(a−α), a=17.27, b=237.7'
    },
    HeatIndex: {
        wiki: 'https://en.wikipedia.org/wiki/Heat_index',
        desc: 'Heat Index – NWS Rothfusz regression (°F→°C), applied when T≥27°C'
    },
    WBGT: {
        wiki: 'https://en.wikipedia.org/wiki/Wet-bulb_globe_temperature',
        desc: 'WBGT = 0.7·Twb + 0.2·Tg + 0.1·T  |  Tg = T + (solar/1000)·10/(1+0.8·(ws+pace))  |  pace (min/km) → m/s added to ambient WS'
    },
    Temperature: {
        wiki: 'https://en.wikipedia.org/wiki/Temperature',
        desc: 'Temperature – direct measurement (°C)'
    },
};
const monthNames   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthNamesHe = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// Approximate Israeli sunrise/sunset (decimal hours) per month index 0=Jan
const ISRAEL_SUN = [
    [6.67,17.00],[6.33,17.50],[5.83,18.00],[6.17,19.50],
    [5.67,19.83],[5.50,19.83],[5.67,19.67],[6.00,19.25],
    [6.33,18.50],[6.67,17.83],[5.83,17.00],[6.50,16.83]
];

// ---- formulas ----
function dewPoint(T, RH) {
    const a=17.27, b=237.7;
    const alpha = (a*T/(b+T)) + Math.log(RH/100);
    return (b*alpha)/(a-alpha);
}
function heatIndex(T_c, RH) {
    const T = T_c*9/5+32;
    if (T < 80) return T_c;
    let HI = -42.379 + 2.04901523*T + 10.14333127*RH - 0.22475541*T*RH
        - 0.00683783*T*T - 0.05481717*RH*RH + 0.00122874*T*T*RH
        + 0.00085282*T*RH*RH - 0.00000199*T*T*RH*RH;
    if (RH<13 && T>=80 && T<=112)
        HI -= ((13-RH)/4)*Math.sqrt((17-Math.abs(T-95))/17);
    else if (RH>85 && T>=80 && T<=87)
        HI += ((RH-85)/10)*((87-T)/5);
    return (HI-32)*5/9;
}
function wetBulb(T, RH) {
    return T*Math.atan(0.151977*Math.pow(RH+8.313659,0.5))
        +Math.atan(T+RH)-Math.atan(RH-1.676331)
        +0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH)-4.686035;
}
function wbgt(T, RH, ws, solar) {
    const Twb=wetBulb(T,RH);
    const Tg=T+(solar/1000)*10/(1+0.8*Math.max(0.5,ws));
    return 0.7*Twb+0.2*Tg+0.1*T;
}
// Returns wind speed (m/s) contributed by running. 0 if value is 0 or empty.
function paceWindMs() {
    const v = parseFloat(document.getElementById('paceInput').value);
    if (isNaN(v) || v <= 0) return 0;
    if (paceUnit === 'kmh') return v / 3.6;
    return 1000 / (v * 60); // min/km → m/s
}
function computeMeasure(t, rh, ws, sol, measure) {
    switch(measure) {
        case 'RH':        return rh;
        case 'DewPoint':  return dewPoint(t,rh);
        case 'HeatIndex': return heatIndex(t,rh);
        case 'Temperature': return t;
        case 'WBGT':
            // Require solar radiation – return null if missing so no point is plotted.
            if (isNaN(sol)) return null;
            return wbgt(t, rh, (isNaN(ws) ? 2 : ws) + paceWindMs(), sol);
    }
}

// Measures shown together when exactly one station is selected.
// Order controls legend order (top→bottom): Heat Index, Temp, WBGT, RH, Dew Point.
const ALL_MEASURES = ['HeatIndex','Temperature','WBGT','RH','DewPoint'];

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ---- day/night shapes ----
function localDayKey(d) {
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDt(d) {
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function getDayNightShapes(start, end) {
    const shapes=[];
    const cur=new Date(start); cur.setHours(0,0,0,0);
    while (cur<=end) {
        const [srDec,ssDec]=ISRAEL_SUN[cur.getMonth()];
        const srH=Math.floor(srDec), srM=Math.round((srDec%1)*60);
        const ssH=Math.floor(ssDec), ssM=Math.round((ssDec%1)*60);
        const midnight0=new Date(cur);
        const sunrise=new Date(cur); sunrise.setHours(srH,srM,0,0);
        const sunset=new Date(cur);  sunset.setHours(ssH,ssM,0,0);
        const midnight1=new Date(cur); midnight1.setDate(cur.getDate()+1);
        const segs=[
            {x0:midnight0,x1:sunrise, fill:'rgba(100,150,255,0.18)'},
            {x0:sunrise,  x1:sunset,  fill:'rgba(255,215,0,0.13)'},
            {x0:sunset,   x1:midnight1,fill:'rgba(100,150,255,0.18)'}
        ];
        segs.forEach(({x0,x1,fill})=>{
            const cs=new Date(Math.max(x0,start)), ce=new Date(Math.min(x1,end));
            if(cs>=ce) return;
            shapes.push({type:'rect',xref:'x',yref:'paper',
                x0:fmtDt(cs),x1:fmtDt(ce),y0:0,y1:1,
                fillcolor:fill,line:{width:0},layer:'below'});
        });
        cur.setDate(cur.getDate()+1);
    }
    return shapes;
}

// Returns the sunrise/sunset Date objects for the calendar day of `date`.
function getDaySunWindow(date) {
    const [srDec,ssDec]=ISRAEL_SUN[date.getMonth()];
    const srH=Math.floor(srDec), srM=Math.round((srDec%1)*60);
    const ssH=Math.floor(ssDec), ssM=Math.round((ssDec%1)*60);
    const sunrise=new Date(date); sunrise.setHours(srH,srM,0,0);
    const sunset=new Date(date);  sunset.setHours(ssH,ssM,0,0);
    return {sunrise,sunset};
}

// Computes one marker trace per measure for the daily-extrema overlay
// (hourly chart, single-station mode). `entries` is the same gap-aware
// point list used to build the line traces (nulls mark gaps).
//   - If extremaHour (0-23) is set: for each day, pick the single data point
//     closest to that hour and use it for ALL measures (same x for all).
//   - Otherwise (auto mode): for each day, restrict to daytime (sunrise→sunset)
//     and find the extremum per measure — minimum for RH, maximum for others.
function computeExtremaTraces(entries) {
    if (!extremaOn) return [];
    const pts = entries.filter(e => e !== null);
    if (!pts.length) return [];

    const byDay = {};
    pts.forEach(p => {
        const key = localDayKey(p.dt);
        (byDay[key] = byDay[key] || []).push(p);
    });

    const perMeasure = {};
    ALL_MEASURES.forEach(m => perMeasure[m] = { x: [], y: [] });

    Object.values(byDay).forEach(dayPts => {
        if (extremaHour !== null) {
            const d0 = dayPts[0].dt;
            const target = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), extremaHour, 0, 0);
            let best = null, bestDiff = Infinity;
            dayPts.forEach(p => {
                const diff = Math.abs(p.dt - target);
                if (diff < bestDiff) { bestDiff = diff; best = p; }
            });
            if (!best) return;
            ALL_MEASURES.forEach(measure => {
                const val = computeMeasure(best.t, best.rh, best.ws, best.sol, measure);
                if (val === null || isNaN(val)) return;
                perMeasure[measure].x.push(best.dt);
                perMeasure[measure].y.push(val);
            });
        } else {
            const { sunrise, sunset } = getDaySunWindow(dayPts[0].dt);
            const dayWindowPts = dayPts.filter(p => p.dt >= sunrise && p.dt < sunset);
            if (!dayWindowPts.length) return;
            ALL_MEASURES.forEach(measure => {
                let best = null, bestVal = measure === 'RH' ? Infinity : -Infinity;
                dayWindowPts.forEach(p => {
                    const val = computeMeasure(p.t, p.rh, p.ws, p.sol, measure);
                    if (val === null || isNaN(val)) return;
                    if (measure === 'RH' ? val < bestVal : val > bestVal) { bestVal = val; best = p; }
                });
                if (!best) return;
                perMeasure[measure].x.push(best.dt);
                perMeasure[measure].y.push(bestVal);
            });
        }
    });

    return ALL_MEASURES.map(measure => ({
        x: perMeasure[measure].x, y: perMeasure[measure].y,
        type: 'scatter', mode: 'markers',
        marker: { color: MEASURE_COLORS[measure], size: 9, line: { color: 'white', width: 1 } },
        yaxis: measure === 'RH' ? 'y' : 'y2',
        showlegend: false, hoverinfo: 'x+y', name: measureLabels[measure]
    })).filter(t => t.x.length > 0);
}

// ---- hourly range ----
function getHourlyRange() {
    if (hourlyMode==='last30') {
        const end=new Date(NOW), start=new Date(NOW);
        start.setDate(start.getDate()-30);
        return [start,end];
    }
    return [
        new Date(hourlyYear,hourlyMonth-1,1,0,0,0),
        new Date(hourlyYear,hourlyMonth,0,23,59,59)
    ];
}

function updateHourlyNav() {
    const label=document.getElementById('hourlyPeriodLabel');
    const btn30=document.getElementById('btnLast30');
    if (hourlyMode==='last30') {
        label.textContent='30 ימים אחרונים'; btn30.classList.add('active');
    } else {
        label.textContent=`${monthNamesHe[hourlyMonth-1]} ${hourlyYear}`; btn30.classList.remove('active');
    }
}

// ---- load year data ----
function loadYearData(year) {
    setStatus('טוען נתונים...');
    return Promise.all([
        d3.csv(`${rawBase}/rh_${year}.csv`),
        d3.csv(`${rawBase}/temp_max_${year}.csv`),
        d3.csv(`${rawBase}/ws_${year}.csv`),
        d3.csv(`${rawBase}/grad_${year}.csv`)
    ]).then(([rhData, tempData, wsData, gradData]) => {
        const rhCols = Object.keys(rhData[0]).filter(k=>k!=='datetime');
        const tempMap={}, wsMap={}, gradMap={};
        tempData.forEach(r=>{tempMap[r.datetime]=r;});
        wsData.forEach(r=>{wsMap[r.datetime]=r;});
        gradData.forEach(r=>{gradMap[r.datetime]=r;});

        const parseTime=d3.timeParse('%Y-%m-%d %H:%M');
        rawRows=[];
        computedMonthly={};
        monthlySums={};
        completeStations=new Set();

        rhData.forEach(row=>{
            const dt=row.datetime;
            const dtObj=parseTime(dt);
            const tempRow=tempMap[dt]||{}, wsRow=wsMap[dt]||{}, gradRow=gradMap[dt]||{};
            rhCols.forEach(st=>{
                const rh=parseFloat(row[st]), t=parseFloat(tempRow[st]);
                const ws_=parseFloat(wsRow[st]);
                const gradSt = GRAD_LINKS[st] || st;
                const sol=parseFloat(gradRow[gradSt]);
                if(isNaN(rh)||isNaN(t)) return;
                if(!isNaN(sol)&&!isNaN(ws_)) completeStations.add(st);
                rawRows.push({dt:dtObj,st,rh,t,ws:ws_,sol});
            });
        });

        // Group rawRows by station → day string
        const byStDay={};
        rawRows.forEach(r=>{
            const key=localDayKey(r.dt);
            if(!byStDay[r.st]) byStDay[r.st]={};
            if(!byStDay[r.st][key]) byStDay[r.st][key]=[];
            byStDay[r.st][key].push(r);
        });

        const avg=arr=>arr.length>0?arr.reduce((a,b)=>a+b)/arr.length:null;

        rhCols.forEach(st=>{
            computedMonthly[st]={RH:[],DewPoint:[],HeatIndex:[],Temperature:[],RH_max:[],DewPoint_max:[],HeatIndex_max:[],Temperature_max:[]};
            monthlySums[st]=Array.from({length:12},()=>({T:0,RH2:0,WS:0,SOL:0,nWB:0,peaks:[]}));

            const daysByMo=Array.from({length:12},()=>[]);
            if(byStDay[st]){
                Object.entries(byStDay[st]).forEach(([ds,rows])=>{
                    const [dsYear,dsMonth]=ds.split('-');
                    if(parseInt(dsYear)!==year) return; // guard: skip dates outside requested year
                    const mo=parseInt(dsMonth)-1;
                    daysByMo[mo].push(rows);
                });
            }

            for(let mo=0;mo<12;mo++){
                const days=daysByMo[mo];
                const acc=monthlySums[st][mo];
                const dRH=[],dDP=[],dHI=[],dT=[],dRHx=[],dDPx=[],dHIx=[],dTx=[];

                days.forEach(rows=>{
                    const valid=rows.filter(r=>!isNaN(r.rh)&&!isNaN(r.t));
                    if(valid.length===0) return;
                    const rhs=valid.map(r=>r.rh);
                    const dps=valid.map(r=>dewPoint(r.t,r.rh));
                    const his=valid.map(r=>heatIndex(r.t,r.rh));
                    const ts=valid.map(r=>r.t);
                    // Daily RH baseline uses the day's minimum (driest point), not the mean.
                    dRH.push(Math.min(...rhs)); dDP.push(avg(dps)); dHI.push(avg(his)); dT.push(avg(ts));
                    dRHx.push(Math.max(...rhs)); dDPx.push(Math.max(...dps)); dHIx.push(Math.max(...his)); dTx.push(Math.max(...ts));

                    const wv=valid.filter(r=>!isNaN(r.sol));
                    wv.forEach(r=>{acc.T+=r.t;acc.RH2+=r.rh;acc.WS+=(isNaN(r.ws)?2:r.ws);acc.SOL+=r.sol;acc.nWB++;});
                    if(wv.length>0){
                        let mw=-Infinity,pr=null;
                        wv.forEach(r=>{const w=wbgt(r.t,r.rh,isNaN(r.ws)?2:r.ws,r.sol);if(w>mw){mw=w;pr=r;}});
                        acc.peaks.push({t:pr.t,rh:pr.rh,ws:isNaN(pr.ws)?2:pr.ws,sol:pr.sol});
                    }
                });

                computedMonthly[st].RH.push(avg(dRH));       computedMonthly[st].DewPoint.push(avg(dDP));
                computedMonthly[st].HeatIndex.push(avg(dHI)); computedMonthly[st].Temperature.push(avg(dT));
                computedMonthly[st].RH_max.push(avg(dRHx));  computedMonthly[st].DewPoint_max.push(avg(dDPx));
                computedMonthly[st].HeatIndex_max.push(avg(dHIx)); computedMonthly[st].Temperature_max.push(avg(dTx));
            }
        });
        return rhCols;
    });
}

// ---- init ----
$(document).ready(function () {
    $('#measureSelect').select2({minimumResultsForSearch:Infinity});

    const yearSel=document.getElementById('dataYearSelect');

    initMap();
    setStatus('טוען נתונים...');

    function populateYearSelector() {
        yearSel.innerHTML='';
        AVAILABLE_HEAT_YEARS.slice().reverse().forEach(y=>{
            const opt=document.createElement('option');
            opt.value=y; opt.textContent=y;
            if(y===currentDataYear) opt.selected=true;
            yearSel.appendChild(opt);
        });
        // If current year isn't available, default to the most recent available year
        if(!AVAILABLE_HEAT_YEARS.includes(currentDataYear) && AVAILABLE_HEAT_YEARS.length>0){
            currentDataYear=AVAILABLE_HEAT_YEARS[AVAILABLE_HEAT_YEARS.length-1];
            yearSel.value=currentDataYear;
        }
    }

    detectAvailableYears().then(()=>{
        populateYearSelector();
        return Promise.all([d3.csv(stationsUrl), loadStationTranslations()]);
    }).then(([stations])=>{
        stations.forEach(s=>{
            try {
                const loc=JSON.parse(s.location.replace(/'/g,'"'));
                stationCoords[s.name.trim()]={lat:loc.latitude,lon:loc.longitude};
            } catch(e){}
        });
        return loadYearData(currentDataYear);
    }).then(rhCols=>{
        addStationMarkers(rhCols);
        setStatus('לחץ על תחנות במפה לבחירה');
        const DEFAULT_STATION = 'BET DAGAN';
        if (selectedStations.length===0 && rhCols.includes(DEFAULT_STATION)) {
            toggleStation(DEFAULT_STATION); // also calls updatePlots()
        } else {
            updatePaceVisibility();
            updatePlots();
        }
    }).catch(err=>{
        console.error(err);
        setStatus('שגיאה: '+err.message);
    });

    $('#measureSelect').on('change',function(){
        currentMeasure=$(this).val();
        updatePaceVisibility();
        updatePlots();
    });

    const paceInput=document.getElementById('paceInput');
    const paceMsSpan=document.getElementById('paceMs');
    paceInput.addEventListener('input',function(){
        const ms=paceWindMs();
        paceMsSpan.textContent = ms>0 ? `= ${ms.toFixed(2)} m/s` : '= 0.00 m/s';
        if(currentMeasure==='WBGT' || selectedStations.length===1) updatePlots();
    });

    document.getElementById('paceUnitBtn').addEventListener('click',function(){
        paceUnit = paceUnit==='minperkm' ? 'kmh' : 'minperkm';
        this.textContent = paceUnit==='minperkm' ? 'קמ"ש' : 'דק\'/ק"מ';
        document.getElementById('paceLabel').textContent =
            paceUnit==='minperkm' ? 'קצב ריצה (דק\'/ק"מ):' : 'מהירות ריצה (קמ"ש):';
        paceInput.value = 0;
        paceMsSpan.textContent = '= 0.00 m/s';
        if(currentMeasure==='WBGT' || selectedStations.length===1) updatePlots();
    });

    document.getElementById('dailyModeBtn').addEventListener('click',function(){
        dailyMode = dailyMode==='mean' ? 'max' : 'mean';
        this.textContent = dailyMode==='mean' ? 'מקסימום יומי' : 'ממוצע יומי';
        updateMonthlyPlot();
    });

    document.getElementById('extremaBtn').addEventListener('click',function(){
        extremaOn = !extremaOn;
        this.textContent = extremaOn ? 'דלוק' : 'כבוי';
        this.classList.toggle('active', extremaOn);
        updateHourlyPlot();
    });
    document.getElementById('extremaHourInput').addEventListener('input',function(){
        const v = this.value.replace(/[^0-9]/g,'').slice(0,2);
        this.value = v;
        if (v.length===2) {
            const num = parseInt(v,10);
            extremaHour = (num>=0 && num<=23) ? num : null;
        } else {
            extremaHour = null;
        }
        if (extremaOn) updateHourlyPlot();
    });
    $('#clearBtn').on('click',function(){
        selectedStations=[];
        Object.entries(stationMarkers).forEach(([name,{marker,complete}])=>
            marker.setStyle(complete
                ? {color:'#1976d2',fillColor:'#42a5f5',weight:1.5,opacity:0.5,fillOpacity:0.5}
                : {color:'#ad1457',fillColor:'#f48fb1',weight:1.5,opacity:0.5,fillOpacity:0.5}));
        updatePaceVisibility();
        updatePlots();
    });

    // Year selector
    yearSel.addEventListener('change',function(){
        currentDataYear=+this.value;
        hourlyYear=currentDataYear;
        if(hourlyMode==='last30'){hourlyMode='month'; hourlyMonth=NOW.getMonth()+1;}
        updateHourlyNav();
        loadYearData(currentDataYear).then(()=>{
            setStatus('לחץ על תחנות במפה לבחירה');
            updatePlots();
        }).catch(err=>{setStatus('שגיאה: '+err.message);});
    });

    // Hourly nav buttons
    document.getElementById('btnLast30').addEventListener('click',()=>{
        hourlyMode='last30'; hourlyYear=currentDataYear; updateHourlyNav(); updateHourlyPlot();
    });
    document.getElementById('btnPrevMonth').addEventListener('click',()=>{
        if(hourlyMode==='last30'){hourlyYear=currentDataYear; hourlyMonth=NOW.getMonth()+1;}
        hourlyMode='month'; hourlyMonth--;
        if(hourlyMonth<1){hourlyMonth=12; hourlyYear--;}
        updateHourlyNav(); updateHourlyPlot();
    });
    document.getElementById('btnNextMonth').addEventListener('click',()=>{
        if(hourlyMode==='last30') return;
        hourlyMonth++;
        if(hourlyMonth>12){hourlyMonth=1; hourlyYear++;}
        updateHourlyNav(); updateHourlyPlot();
    });
});

// ---- map ----
function initMap() {
    map=L.map('map').setView([31.5,35.0],8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap contributors',maxZoom:18
    }).addTo(map);

    // Legend below zoom buttons
    const legend = L.control({position:'topleft'});
    legend.onAdd = function() {
        const div = L.DomUtil.create('div','leaflet-bar');
        div.style.cssText = 'background:white;padding:5px 8px;font-size:0.78em;line-height:1.6;cursor:default;direction:rtl;';
        div.innerHTML =
            '<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#42a5f5;border:1.5px solid #1976d2;vertical-align:middle;margin-left:4px;"></span>כל החיישנים<br>' +
            '<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#f48fb1;border:1.5px solid #ad1457;vertical-align:middle;margin-left:4px;"></span>חלק מהחיישנים';
        L.DomEvent.disableClickPropagation(div);
        return div;
    };
    legend.addTo(map);
}

function addStationMarkers(stationNames) {
    Object.values(stationMarkers).forEach(({marker})=>marker.remove());
    stationMarkers={};

    // Add incomplete (pink) stations first so complete (blue) render on top and are easier to click
    const incomplete = stationNames.filter(n => !completeStations.has(n));
    const complete   = stationNames.filter(n =>  completeStations.has(n));

    [...incomplete, ...complete].forEach(name=>{
        const coords=stationCoords[name];
        if(!coords) return;
        const isComplete = completeStations.has(name);
        const baseStyle = isComplete
            ? {color:'#1976d2', fillColor:'#42a5f5'}
            : {color:'#ad1457', fillColor:'#f48fb1'};
        const marker=L.circleMarker([coords.lat,coords.lon],{
            radius:7, ...baseStyle, fillOpacity:0.6, weight:1.5, opacity:0.55
        }).addTo(map);
        // direction:'left' avoids Leaflet's translateX(-50%) centering transform used by
        // 'top'/'auto', which gets mirrored incorrectly under dir="rtl" ancestors and makes
        // the tooltip render far to the left. See forecast.html for the same workaround.
        marker.bindTooltip(`${getHebrewName(name)} (${name})`,{direction:'right', offset:[-5,0]});
        marker.on('click',()=>toggleStation(name));
        stationMarkers[name]={marker, complete:isComplete};
    });
}

function toggleStation(name) {
    const idx=selectedStations.indexOf(name);
    if(idx===-1){
        selectedStations.push(name);
        stationMarkers[name].marker.setStyle({color:'#b71c1c',fillColor:'#ef5350',weight:2.5,opacity:1,fillOpacity:0.9});
    } else {
        selectedStations.splice(idx,1);
        const complete=stationMarkers[name].complete;
        stationMarkers[name].marker.setStyle(complete
            ? {color:'#1976d2',fillColor:'#42a5f5',weight:1.5,opacity:0.5,fillOpacity:0.5}
            : {color:'#ad1457',fillColor:'#f48fb1',weight:1.5,opacity:0.5,fillOpacity:0.5});
    }
    // When moving from a single station (all-measures view) to a second station,
    // reset to the default measure (Heat Index) for the normal multi-station view.
    if (selectedStations.length === 2) {
        currentMeasure = 'HeatIndex';
        const ms = document.getElementById('measureSelect');
        ms.value = 'HeatIndex';
        $(ms).val('HeatIndex').trigger('change.select2');
    }
    updatePaceVisibility();
    updatePlots();
}

function updatePaceVisibility() {
    const pg = document.getElementById('paceGroup');
    // Show pace control whenever WBGT is relevant: always in single-station
    // (all-measures) mode, or when WBGT is the chosen measure in multi-station mode.
    pg.style.display = (selectedStations.length===1 || currentMeasure==='WBGT') ? 'flex' : 'none';
}

// ---- plots ----
function getMonthlyWBGT(stName) {
    const sums = monthlySums[stName];
    if (!sums) return new Array(12).fill(null);
    const extra = paceWindMs();
    return sums.map(acc => {
        if (dailyMode === 'max') {
            if (acc.peaks.length === 0) return null;
            const ws = acc.peaks.map(p => wbgt(p.t, p.rh, p.ws + extra, p.sol));
            return ws.reduce((a,b)=>a+b) / ws.length;
        } else {
            if (acc.nWB === 0) return null;
            return wbgt(acc.T/acc.nWB, acc.RH2/acc.nWB, acc.WS/acc.nWB + extra, acc.SOL/acc.nWB);
        }
    });
}
function getMonthlyY(stName, measure) {
    if (measure === 'WBGT') return getMonthlyWBGT(stName);
    const key = dailyMode === 'max' ? measure + '_max' : measure;
    const data = computedMonthly[stName];
    if (!data) return new Array(12).fill(null);
    return data[key] || data[measure] || new Array(12).fill(null);
}
function yRange(measure) {
    return measure === 'RH' ? [0, 100] : [-5, 50];
}

// Dual-axis config for the single-station "all measures" view.
// RH (%) on the left: 11 ticks 0..100 step 10, range extended to -10 so that
// the 0% gridline aligns exactly with the 0°C gridline on the right axis
// (both axes share the same -1/11 fractional buffer below zero).
function dualAxisLayout() {
    const gridStyle = { gridcolor:'rgba(80,80,80,0.35)', gridwidth:1, zeroline:false };
    return {
        yaxis:  { title:'לחות יחסית (%)', range:[-10,100], tick0:0, dtick:10, side:'left', ...gridStyle },
        yaxis2: { title:'°C', range:[-5,50], tick0:0, dtick:5, overlaying:'y', side:'right', ...gridStyle }
    };
}

function updatePlots(){ updateMonthlyPlot(); updateHourlyPlot(); }

function emptyLayout(msg) {
    return {title:{text:msg,x:0.5},paper_bgcolor:'white',plot_bgcolor:'#fafafa',margin:{t:45,r:15,l:50,b:50}};
}

function updateMonthlyPlot() {
    if(selectedStations.length===0){
        Plotly.newPlot('monthlyPlot',[],emptyLayout('בחר תחנה אחת או יותר במפה'),{responsive:true});
        return;
    }
    const modeLabel = dailyMode === 'max' ? 'ממוצע מקסימומים יומיים' : 'ממוצע יומי';

    if (selectedStations.length === 1) {
        // Single station: show ALL measures together, dual y-axis (RH % left, °C right).
        const name = selectedStations[0];
        const traces = ALL_MEASURES.map((measure)=>({
            x:monthNames,
            y: getMonthlyY(name, measure),
            type:'scatter',mode:'lines+markers',
            name:measureLabels[measure], connectgaps:false,
            yaxis: measure==='RH' ? 'y' : 'y2',
            line:{color:MEASURE_COLORS[measure],width:2.5},marker:{size:6}
        }));
        Plotly.newPlot('monthlyPlot',traces,{
            title:{
                text:`${getHebrewName(name)} - כל המדדים - ${modeLabel} ${currentDataYear}`,
                x:0.95, xanchor:'right'
            },
            xaxis:{title:'חודש',tickvals:monthNames,ticktext:monthNames},
            ...dualAxisLayout(),
            hovermode:'x unified',
            legend:{orientation:'v',x:0,y:1,xanchor:'left',yanchor:'top',title:{text:getHebrewName(name)}},
            dir:'rtl',paper_bgcolor:'white',plot_bgcolor:'#fafafa',
            margin:{t:70,r:50,l:50,b:40}
        },{responsive:true});
    } else {
        const traces=selectedStations.map((name,i)=>({
            x:monthNames,
            y: getMonthlyY(name, currentMeasure),
            type:'scatter',mode:'lines+markers',
            name:getHebrewName(name),connectgaps:false,
            line:{color:COLORS[i%COLORS.length],width:2.5},marker:{size:6}
        }));
        const info = measureInfo[currentMeasure];
        Plotly.newPlot('monthlyPlot',traces,{
            title:{
                text:`${measureLabels[currentMeasure]} - ${modeLabel} ${currentDataYear}<br>` +
                     `<span style="font-size:0.78em;color:#555">${info.desc} ` +
                     `[<a href="${info.wiki}" target="_blank" style="color:#1976d2">Wikipedia</a>]</span>`,
                x:0.95, xanchor:'right'
            },
            xaxis:{title:'חודש',tickvals:monthNames,ticktext:monthNames},
            yaxis:{title:measureLabels[currentMeasure], range:yRange(currentMeasure)},
            hovermode:'x unified',
            legend:{orientation:'v',x:0,y:1,xanchor:'left',yanchor:'top'},
            dir:'rtl',paper_bgcolor:'white',plot_bgcolor:'#fafafa',
            margin:{t:70,r:15,l:50,b:40}
        },{responsive:true});
    }

    // Click on monthly chart → navigate hourly to that month
    document.getElementById('monthlyPlot').on('plotly_click',(data)=>{
        if(!data.points.length) return;
        const mIdx=monthNames.indexOf(data.points[0].x);
        if(mIdx<0) return;
        hourlyMode='month';
        hourlyMonth=mIdx+1;
        hourlyYear=currentDataYear;
        updateHourlyNav();
        updateHourlyPlot();
    });
}

function updateHourlyPlot() {
    if(selectedStations.length===0){
        Plotly.newPlot('hourlyPlot',[],emptyLayout('נתונים שעתיים'),{responsive:true});
        return;
    }
    const [startDate,endDate]=getHourlyRange();
    const GAP_MS = 3 * 3600 * 1000; // 3-hour gap threshold

    if (selectedStations.length === 1) {
        // Single station: show ALL measures together, dual y-axis (RH % left, °C right).
        const name = selectedStations[0];
        const pts=rawRows
            .filter(r=>r.st===name && r.dt>=startDate && r.dt<=endDate)
            .sort((a,b)=>a.dt-b.dt);
        // Build a common list of entries (with null gaps) so all measure traces align.
        const entries=[];
        pts.forEach((p,idx)=>{
            if(idx>0 && (p.dt - pts[idx-1].dt) > GAP_MS) entries.push(null);
            entries.push(p);
        });
        const xArr = entries.map(e=> e ? e.dt : null);
        const traces = ALL_MEASURES.map((measure)=>({
            x:xArr,
            y:entries.map(e=> e ? computeMeasure(e.t,e.rh,e.ws,e.sol,measure) : null),
            type:'scatter',mode:'lines',connectgaps:false,
            name:measureLabels[measure],
            yaxis: measure==='RH' ? 'y' : 'y2',
            line:{color:MEASURE_COLORS[measure],width:1.5}
        }));
        traces.push(...computeExtremaTraces(entries));
        Plotly.newPlot('hourlyPlot',traces,{
            title:{text:`${getHebrewName(name)} - כל המדדים - שעתי`,x:0.95,xanchor:'right'},
            xaxis:{title:'זמן'},
            ...dualAxisLayout(),
            shapes:getDayNightShapes(startDate,endDate),
            hovermode:'x unified',
            showlegend:false,
            dir:'rtl',paper_bgcolor:'white',plot_bgcolor:'#fafafa',
            margin:{t:45,r:50,l:50,b:40}
        },{responsive:true});
        return;
    }

    const traces=selectedStations.map((name,i)=>{
        const pts=rawRows
            .filter(r=>r.st===name && r.dt>=startDate && r.dt<=endDate)
            .sort((a,b)=>a.dt-b.dt);
        const xArr=[], yArr=[];
        pts.forEach((p,idx)=>{
            if(idx>0 && (p.dt - pts[idx-1].dt) > GAP_MS){ xArr.push(null); yArr.push(null); }
            xArr.push(p.dt);
            yArr.push(computeMeasure(p.t,p.rh,p.ws,p.sol,currentMeasure));
        });
        return {
            x:xArr, y:yArr,
            type:'scatter',mode:'lines',connectgaps:false,
            name:getHebrewName(name),
            line:{color:COLORS[i%COLORS.length],width:1.5}
        };
    });
    Plotly.newPlot('hourlyPlot',traces,{
        title:{text:`${measureLabels[currentMeasure]} - שעתי`,x:0.95,xanchor:'right'},
        xaxis:{title:'זמן'},
        yaxis:{title:measureLabels[currentMeasure], range:yRange(currentMeasure)},
        shapes:getDayNightShapes(startDate,endDate),
        hovermode:'x unified',
        showlegend:false,
        dir:'rtl',paper_bgcolor:'white',plot_bgcolor:'#fafafa',
        margin:{t:45,r:15,l:50,b:40}
    },{responsive:true});
}
