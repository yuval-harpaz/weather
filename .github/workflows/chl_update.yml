name: Chlorophyll Data Update

on:
  schedule:
    # Mondays 04:00 UTC. The reprocessed ocean-colour stream advances in batches
    # and runs about a week behind, so there is nothing to gain from daily runs.
    - cron: '0 4 * * 1'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  update-chl-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install copernicusmarine xarray pyarrow h5netcdf

      - name: Update the current year
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          cd code
          python chl_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only the files this job is supposed to produce. A blanket "add -A"
          # in a job that holds credentials can publish anything that happens to
          # land in the tree; this cannot.
          git add data/chl_transect_multi1km_*.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto update chlorophyll data"
            git pull --no-rebase
            git push
          fi
