name: Sea Surface Temperature Update

on:
  schedule:
    # Daily 13:00 UTC. The near-real-time file for a given day is published
    # between 11:27 and 12:07 UTC that same day - measured over ten consecutive
    # days from the producer's own object store, which is a tight enough window
    # to sit just behind. Running earlier would collect yesterday instead, and
    # running much later gains nothing since the next file is a day away.
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  update-sst-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install copernicusmarine xarray pyarrow h5netcdf

      - name: Update the station temperatures
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          cd code
          python sst_stations.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only the files this job produces. The trailing file changes daily;
          # the per-station archive files only when the reprocessed record
          # advances, roughly once a month.
          git add data/sst_nrt.csv data/sst_rep_*.csv data/sst_nrt_*.csv data/sst_stations.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto update sea surface temperature"
            git pull --no-rebase
            git push
          fi
