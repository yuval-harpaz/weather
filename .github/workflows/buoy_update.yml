name: Sdot Yam Buoy Update

on:
  schedule:
    # Daily 04:30 UTC. The buoy reports every 20 minutes, so there is always
    # something new; running once a day keeps the commit history to one row per
    # day rather than seventy.
    - cron: '30 4 * * *'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  update-buoy-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update the buoy table
        env:
          # The endpoint is a repository secret, not a line of code. Add it at
          # Settings > Secrets and variables > Actions, named BUOY_API.
          BUOY_API: ${{ secrets.BUOY_API }}
        run: |
          cd code
          python buoy_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/buoy_sdot_yam.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto update buoy data"
            git pull --no-rebase
            git push
          fi
