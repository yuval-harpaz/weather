name: Grid Peak Data Update

on:
  schedule:
    # Weekly, Sunday 05:00 UTC. Noga publishes one file per month and the
    # newest one lags by more than a month - in mid-September the latest
    # available covered July - so a daily job would spend almost every run
    # finding nothing. Weekly still notices a new month within days of it
    # appearing.
    - cron: '0 5 * * 0'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  update-grid-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the peak-hour table
        run: |
          cd code
          python grid_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/grid_peaks.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto update grid peak data"
            git pull --no-rebase
            git push
          fi
